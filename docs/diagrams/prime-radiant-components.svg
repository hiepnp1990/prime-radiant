<g class="c-blue"><rect x="190" y="416" width="140" height="56" rx="4"/><text class="th" x="260" y="435" text-anchor="middle" dominant-baseline="central">Archiver</text><text class="ts" x="260" y="454" text-anchor="middle" dominant-baseline="central">Seals segments</text></g>
<g class="c-blue"><rect x="350" y="416" width="140" height="56" rx="4"/><text class="th" x="420" y="435" text-anchor="middle" dominant-baseline="central">Indexer</text><text class="ts" x="420" y="454" text-anchor="middle" dominant-baseline="central">Parses sources</text></g>
