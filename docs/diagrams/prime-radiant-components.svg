<g class="c-blue"><rect x="190" y="556" width="140" height="46"/><ellipse cx="260" cy="556" rx="70" ry="6"/><text class="th" x="260" y="571" text-anchor="middle" dominant-baseline="central">Cold archive</text><text class="ts" x="260" y="589" text-anchor="middle" dominant-baseline="central">Durable history</text></g>
</svg>
