<svg xmlns="http://www.w3.org/2000/svg" width="680" height="636" viewBox="0 0 680 636" role="img">
<title>Prime Radiant components</title>
<desc>Chat providers sync every device. On each machine, the extension captures chats into the local spool, coding agents write native transcripts, and the collector sends both to intake on the always-on hub, where the importer also loads account exports. Intake writes the hot store. The indexer builds the index. Query answers the CLI and skill from the index and the hot store. The archiver seals segments into the cold archive in cloud storage.</desc>
<style>
svg { --bg:#FFFFFF; --line:#5F5E5A; --text:#2C2C2A; --muted:#5F5E5A; --box-s:#B4B2A9;
  --blue-f:#E6F1FB; --blue-s:#185FA5; --blue-t:#0C447C; --gray-f:#F1EFE8; --gray-s:#5F5E5A; --gray-t:#444441; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0D1117; --line:#B4B2A9; --text:#F1EFE8; --muted:#B4B2A9; --box-s:#5F5E5A;
    --blue-f:#0C447C; --blue-s:#85B7EB; --blue-t:#B5D4F4; --gray-f:#444441; --gray-s:#B4B2A9; --gray-t:#D3D1C7; }
}
.bg { fill:var(--bg); }
.th { font:500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--text); }
.ts { font:400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--muted); }
.frame { fill:none; stroke:var(--box-s); stroke-width:1; stroke-dasharray:4 4; }
.arr { stroke:var(--line); stroke-width:1.5; fill:none; }
.head { stroke:var(--line); fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.c-blue > rect, .c-blue > ellipse { fill:var(--blue-f); stroke:var(--blue-s); stroke-width:1; }
.c-blue > .th { fill:var(--blue-t); } .c-blue > .ts { fill:var(--blue-s); }
.c-gray > rect { fill:var(--gray-f); stroke:var(--gray-s); stroke-width:1; }
.c-gray > .th { fill:var(--gray-t); } .c-gray > .ts { fill:var(--gray-s); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="636" rx="12"/>
<g class="c-gray"><rect x="30" y="20" width="140" height="56" rx="4"/><text class="th" x="100" y="39" text-anchor="middle" dominant-baseline="central">Chat providers</text><text class="ts" x="100" y="58" text-anchor="middle" dominant-baseline="central">All devices sync</text></g>
<rect class="frame" x="20" y="96" width="640" height="180" rx="12"/>
<text class="th" x="644" y="116" text-anchor="end">Each machine</text>
<line class="arr" x1="100" y1="76" x2="100" y2="124" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="30" y="126" width="140" height="56" rx="4"/><text class="th" x="100" y="145" text-anchor="middle" dominant-baseline="central">Extension</text><text class="ts" x="100" y="164" text-anchor="middle" dominant-baseline="central">Snapshots, sweep</text></g>
<g class="c-gray"><rect x="190" y="126" width="140" height="56" rx="4"/><text class="th" x="260" y="145" text-anchor="middle" dominant-baseline="central">Coding agents</text><text class="ts" x="260" y="164" text-anchor="middle" dominant-baseline="central">Harness + model</text></g>
<line class="arr" x1="330" y1="154" x2="508" y2="154" marker-end="url(#arrow)"/>
