<line class="arr" x1="100" y1="182" x2="100" y2="204" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="30" y="212" width="140" height="50"/><ellipse cx="100" cy="212" rx="70" ry="6"/><text class="th" x="100" y="228" text-anchor="middle" dominant-baseline="central">Local spool</text><text class="ts" x="100" y="247" text-anchor="middle" dominant-baseline="central">Pending captures</text></g>
