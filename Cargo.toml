[package]
name = "prime-radiant"
version = "0.1.0"
edition = "2024"
description = "Find and read any past AI session from one always-on hub."
license = "MIT"
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
notify = "8"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
