<g class="c-blue"><rect x="350" y="332" width="140" height="50"/><ellipse cx="420" cy="332" rx="70" ry="6"/><text class="th" x="420" y="348" text-anchor="middle" dominant-baseline="central">Hot store</text><text class="ts" x="420" y="367" text-anchor="middle" dominant-baseline="central">Recent sessions</text></g>
<line class="arr" x1="510" y1="354" x2="492" y2="354" marker-end="url(#arrow)"/>
